name: CI

on:
  push:
    branches:
      - master
      # Release branches. `pilot-release-candidate` carried the entire pilot
      # integration and, because the triggers named only `master`, CI had never
      # run against a single commit of it — the branch being cut for a real
      # school was the one branch with no automated gate behind it.
      - "*-release-candidate"
      # The language migration. A branch that rewrites every reference solution
      # in the programme is precisely one that must not merge on the strength of
      # a local run — the same reasoning that added the release-candidate
      # pattern above, and the same mistake if it is left out.
      - "cpp17-migration"
  pull_request:
    branches:
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    # A real Postgres, because `tests/store/postgres-driver.test.ts` skips
    # itself without DATABASE_URL and its own header says "CI is where it must
    # actually run, with DATABASE_URL set". It was skipping. Production is
    # Postgres and development is PGlite, so the driver that ships is the one
    # no gate was exercising.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solvex_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify generated files are in sync
        shell: bash
        run: |
          bash scripts/sync-agent-rules.sh
          node scripts/sync-skills.mjs

          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::Generated files are out of sync with their sources (AGENTS.md / SKILL.md)."
            echo "Run the sync scripts locally and commit the result:"
            echo "  bash scripts/sync-agent-rules.sh"
            echo "  node scripts/sync-skills.mjs"
            git status --short
            git diff --stat
            exit 1
          fi
          echo "All generated files are in sync with their sources."

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # The gate that had never gated anything.
      #
      # Until now this job ran lint, typecheck and build, and no tests at all.
      # `tests/golden.test.ts` is designated by the imported archive as THE
      # regression check to re-run after every integration step, and it had
      # never run on a push or a pull request in the life of this repository.
      # That is how fourteen typecheck errors and two failing tests sat in the
      # tree unnoticed for an afternoon.
      #
      # Before the build, not after: a build takes minutes and a failing test
      # is the answer either way.
      # The curriculum is content, and content breaks differently from code.
      # `npm run check` has run this locally since the day it existed; CI never
      # did, so a block that fails its own validator could reach master with
      # lint, typecheck and build all green.
      # The gate whose absence let an unbootable chain ship.
      #
      # CI attached a real PostgreSQL and ran the driver suite against it —
      # and never applied a single migration to it. `tests/store/migrate.test.ts`
      # runs on PGlite with the local bootstrap ON, and the driver suite creates
      # no tables, so the shipped SQL had never been applied to a real server
      # the way the app applies it at boot. It died at 0003 on any Postgres that
      # was not Supabase: one table, no product, on first boot.
      #
      # A dedicated database, created here rather than reusing `solvex_ci`,
      # because the script REFUSES a target that already has tables — verifying
      # a chain against a database that already has the schema proves nothing,
      # and that false green is exactly what happened locally.
      - name: Migrations on a pristine PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'create database solvex_migrations'
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/solvex_migrations             npm run db:verify-migrations

      - name: Curriculum validation
        run: npm run curriculum:validate

      # The compiler that certifies the curriculum, BEFORE the tests.
      #
      # `tests/school/content-execution.test.ts` compiles and runs every
      # reference solution in the programme, and it is `it.runIf(haveCompiler)`
      # throughout — so with no toolchain it would report PASS having run
      # nothing, hundreds of tests skipped behind a green tick. It FAILS under
      # CI instead, which is why this step comes before `npm test`.
      #
      # GCC 14 specifically, and not the runner's default g++.
      #
      # Judge0 language 105 is GCC 14.1, and Judge0 is what actually grades a
      # fourteen-year-old. A CI that certifies "every reference solution passes
      # every case" using a different compiler is asserting something about a
      # compiler no learner is ever judged by — and the failure that hides is
      # the worst kind: content green in CI, wrong answer in a classroom, and
      # nothing in between to explain it. `-std=c++17` is passed by the harness;
      # GCC 14's own default is `gnu++17`, which is where the judge sits.
      #
      # The version is asserted rather than assumed, because `apt-get install`
      # succeeding is not the same as `g++` on PATH being the one installed.
      - name: Set up the C++ toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-14
          echo "EXEC_CPP_BIN=g++-14" >> "$GITHUB_ENV"
          g++-14 --version
          actual="$(g++-14 -dumpversion | cut -d. -f1)"
          if [[ "$actual" != "14" ]]; then
            echo "::error::expected GCC 14 to match Judge0 language 105, got $actual"
            exit 1
          fi
          echo "int main(){ static_assert(__cplusplus == 201703L, \"not C++17\"); }" > /tmp/std.cc
          g++-14 -std=c++17 -o /tmp/std /tmp/std.cc && echo "C++17 confirmed"

      # The compiler the LEARNER presses Run on, fetched so a gate can use it.
      #
      # Three compilers touch a child's work — `clang.wasm` in their browser on
      # every Run, GCC 14 on Judge0 on every Check, and whatever this job's
      # `g++` is — and until now only the third had ever compiled the
      # curriculum. `tests/cpp17/curriculum-in-the-learners-compiler.test.ts`
      # puts all 263 reference solutions through the shipped toolchain in about
      # 145 seconds, and it caught a program the host compiler accepts and the
      # browser aborts on: `printf("%.2Lf")`, because long-double formatting is
      # compiled out of that libc.
      #
      # The suite fails rather than skips when the assets are absent under CI
      # (see its release gate), so this step is not optional — a green run
      # without it would be a run that compiled nothing in the engine that
      # matters most.
      #
      # Cached by the pinned upstream commit. The files are content-addressed by
      # a SHA-256 the sync script verifies before writing, so a cache hit is as
      # trustworthy as a download; a new pin changes the key and re-fetches.
      - name: Cache the C++17 browser toolchain
        id: cpp17-cache
        uses: actions/cache@v4
        with:
          path: public/cpp17
          key: cpp17-${{ hashFiles('scripts/cpp17-assets.mjs') }}

      - name: Fetch the C++17 browser toolchain
        if: steps.cpp17-cache.outputs.cache-hit != 'true'
        run: npm run cpp17:sync

      # Python is still installed, and it is no longer about the curriculum.
      #
      # It is here for `npm run test:python` alone — the archive's Nova
      # directive suite, which is TOOLING that processes directives and is
      # unrelated to the language the course teaches. Pinned to 3.12 because
      # that suite uses `int | None` annotations pydantic cannot evaluate on
      # 3.9, and "it passes on the machine with the right Python" is not a gate.
      - name: Set up Python (Nova directive tooling only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install --quiet pytest pydantic

      - name: Test
        run: npm test

      # The Postgres-backed driver suite, against the service above. Separate
      # from `npm test` on purpose: DATABASE_URL set for the whole run would
      # point `getStore()` at Postgres for every suite, and the rest of them are
      # written against the in-memory PGlite the fixtures open themselves.
      # The learner's own compiler, in its own step.
      #
      # Excluded from `npm test` because it is 145 seconds of one core at 100%
      # inside a run that already spawns a real `g++` per reference across every
      # other core — measured together, a two-line snippet blew a two-minute
      # compile timeout. Uncontended here, and it is still a release gate: it
      # FAILS rather than skips when the toolchain is missing under CI.
      - name: Test (the C++ toolchain the browser ships)
        run: npm run test:browser-cpp

      - name: Test (Postgres driver)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/solvex_ci
        run: npx vitest run tests/store/postgres-driver.test.ts

      # The archive's own Nova directive suite — tooling, not the taught
      # language. See the interpreter step above for why 3.12 is pinned.
      - name: Python tests
        run: npm run test:python

      - name: Build
        run: npm run build

      # Greps the built client chunks for the VALUES of server-only secrets.
      # It reads `.next/static`, so it can only run after the build — which is
      # why it is last and not beside the other static checks.
      #
      # The values matter, and this step used to pass none. The script compares
      # chunks against what a secret actually IS, so with an empty environment
      # it searched for nothing, printed a note saying so, and exited 0 — every
      # green run of this gate in the repository's history had verified nothing.
      # It now refuses to pass empty under CI, so these must be set as
      # repository secrets. They are only ever compared against built output and
      # are never printed.
      #
      # If a fork or a contributor's repository has no secrets configured, set
      # BUNDLE_SCAN_ALLOW_EMPTY=1 on this step to go back to the name-only
      # check — but know that it is then not checking for a leak.
      - name: Client bundle secret scan
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JUDGE0_RAPIDAPI_KEY: ${{ secrets.JUDGE0_RAPIDAPI_KEY }}
          LEARNING_ATTESTATION_SECRET: ${{ secrets.LEARNING_ATTESTATION_SECRET }}
          LEARNING_CRON_SECRET: ${{ secrets.LEARNING_CRON_SECRET }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          # LEARNING_CRON_SECRET is excused BY NAME while this repository's own
          # CI has no value for it, and the excuse is now on a clock.
          #
          # It HAS a consumer: `src/app/api/cron/route.ts` compares it against
          # the Bearer token Vercel Cron sends, and `vercel.json` schedules the
          # call. Production sets it. This repository's Actions secrets do not,
          # and a scan for the value of a variable that is empty here searches
          # for nothing — which is precisely the vacuous green this whole step
          # exists to stop.
          #
          # So: set LEARNING_CRON_SECRET as a repository secret and DELETE this
          # line. It is self-correcting in the meantime — the moment the secret
          # has a value, the scan reports this entry as stale and fails until it
          # is removed. Do not extend this list to silence a secret that HAS a
          # value; that is the leak this step exists to catch.
          BUNDLE_SCAN_ALLOW_MISSING: LEARNING_CRON_SECRET
        run: npm run check:bundle

      # The answer key, and it is a different question from the one above.
      #
      # `check:bundle` looks for the VALUES of server-only credentials. This
      # looks for what a fourteen-year-old actually wants: hidden test cases,
      # reference solutions, fill-in answers. It found 2,351,507 bytes of them
      # in one chunk on six learner routes — `/home`, `/lesson/*`, `/course/*`,
      # `/assessment/*`, `/program` and `/review` — shipped by a single pure
      # helper imported from a module that reads `PROGRAM`.
      #
      # It needs no secrets, so it cannot go quietly green the way its
      # predecessor did: it collects the withheld strings from the curriculum
      # itself, proves every detector on a positive control before scanning,
      # refuses a missing or empty `.next/static`, and asserts that every chunk
      # the build manifests name was one of the files it opened.
      - name: Client bundle answer-key scan
        run: npm run check:answers
